name: Integration Tests

# Private-repo Actions minutes are billed per OS (Linux 1x, Windows 2x, macOS 10x), so:
# - path filters skip this workflow for docs-only changes;
# - push/PR runs Linux + Windows + Intel macOS (x86_64 is a hard requirement, so the
#   Intel job builds the packaged app and checks /health on every code change);
# - Apple Silicon macOS runs only on manual dispatch (run_macos=true) and before a release.
# "Required checks" aggregates all jobs; branch protection on main requires it.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'backend/**'
      - 'cli/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'backend/**'
      - 'cli/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/test.yml'
  workflow_dispatch:
    inputs:
      run_macos:
        description: 'Also run macOS ARM64 tests (~10x minutes; Intel always runs)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.m.outputs.include }}
    steps:
      - id: m
        # Apple Silicon runs only on manual dispatch with run_macos=true (10x minutes).
        # Intel macOS is covered by the intel-mac job below, which always runs.
        run: |
          base='[{"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","label":"Linux-x64"},{"platform":"windows-latest","target":"x86_64-pc-windows-msvc","label":"Windows-x64"}'
          mac=',{"platform":"macos-latest","target":"aarch64-apple-darwin","label":"macOS-ARM64"}'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_macos }}" = "true" ]; then
            echo "include=${base}${mac}]" >> "$GITHUB_OUTPUT"
          else
            echo "include=${base}]" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    runs-on: ${{ matrix.platform }}
    env:
      TEST_OPENROUTER_API_KEY: ${{ secrets.TEST_OPENROUTER_API_KEY }}
    name: Test (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          pip install uv
          uv sync --frozen

      # ── Static Analysis ──────────────────────────────────────────────
      - name: Intel Mac wheel coverage (every locked dep has a macOS x86_64 wheel)
        if: runner.os == 'Linux'
        run: python scripts/check-macos-x64-wheels.py uv.lock

      - name: TypeScript type check
        run: npx tsc --noEmit --skipLibCheck

      - name: ESLint
        run: npx eslint . --max-warnings 0
        continue-on-error: true

      - name: Frontend build (Vite)
        run: npm run build

      # ── Unit Tests ───────────────────────────────────────────────────
      - name: Frontend unit tests (Vitest + coverage)
        run: npm run test:coverage

      # Chromium first: the mock-form test (answer-every-question) drives a real page.
      - name: Install Playwright Chromium
        run: uv run python -m playwright install chromium

      - name: Backend unit tests (pytest + coverage)
        run: uv run pytest tests/ --cov --cov-report=term-missing --cov-report=xml

      # ── Integration Tests (Source) ───────────────────────────────────
      - name: Run integration tests (source)
        if: env.TEST_OPENROUTER_API_KEY != ''
        env:
          TEST_OPENROUTER_API_KEY: ${{ secrets.TEST_OPENROUTER_API_KEY }}
        run: uv run python scripts/integration-test.py

      # ── Build Backend Binary ─────────────────────────────────────────
      - name: Build backend binary (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/build-backend.sh ${{ matrix.target }}

      - name: Build backend binary (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File scripts/build-backend.ps1

      # ── UI end to end against the PACKAGED sidecar (M8) ──────────────
      - name: UI e2e (production frontend + packaged sidecar)
        shell: bash
        run: |
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          APPLYQUEUE_SIDECAR="$PWD/src-tauri/binaries/applyqueue-backend-${{ matrix.target }}$EXT" \
            uv run pytest tests/ui_e2e -q -rs

      # ── Integration Tests (Built Binary) ─────────────────────────────
      - name: Run integration tests (binary, Unix)
        if: runner.os != 'Windows' && env.TEST_OPENROUTER_API_KEY != ''
        env:
          TEST_OPENROUTER_API_KEY: ${{ secrets.TEST_OPENROUTER_API_KEY }}
        run: |
          uv run python scripts/integration-test.py --binary src-tauri/binaries/applyqueue-backend-${{ matrix.target }}

      - name: Run integration tests (binary, Windows)
        if: runner.os == 'Windows' && env.TEST_OPENROUTER_API_KEY != ''
        env:
          TEST_OPENROUTER_API_KEY: ${{ secrets.TEST_OPENROUTER_API_KEY }}
        run: |
          uv run python scripts/integration-test.py --binary src-tauri/binaries/applyqueue-backend-${{ matrix.target }}.exe

  intel-mac:
    # Intel Macs (x86_64) are a hard requirement: test natively, build the x86_64
    # PyInstaller sidecar, bundle the .app/.dmg, launch it and check /health.
    runs-on: macos-15-intel
    name: Intel Mac (test, bundle, launch /health)
    timeout-minutes: 75
    env:
      UV_PYTHON_PREFERENCE: only-managed
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - name: Wheel coverage for macOS x86_64
        run: python3 scripts/check-macos-x64-wheels.py uv.lock
      - name: Python dependencies (native x86_64)
        run: |
          uv sync --frozen --python 3.13
          ARCH=$(uv run python -c "import platform; print(platform.machine())")
          echo "Python arch: $ARCH"
          test "$ARCH" = "x86_64"
      - run: npm ci
      - name: Install Playwright Chromium (mock ATS + agent e2e)
        run: uv run python -m playwright install chromium
      - name: Backend unit tests (pytest, x86_64)
        run: uv run pytest tests/ -q
      - name: Build backend sidecar (x86_64)
        run: bash scripts/build-backend.sh x86_64-apple-darwin
      - name: Sidecar self-test (frozen binary)
        run: src-tauri/binaries/applyqueue-backend-x86_64-apple-darwin --self-test
      - name: Bundle Tauri app (x86_64, unsigned)
        run: npx tauri build --target x86_64-apple-darwin --bundles app,dmg
      - name: UI e2e (production frontend + packaged x86_64 sidecar)
        run: |
          APPLYQUEUE_SIDECAR="$PWD/src-tauri/binaries/applyqueue-backend-x86_64-apple-darwin" \
            uv run pytest tests/ui_e2e -q -rs
      - name: Launch packaged app and check /health
        run: |
          APP=$(ls -d src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app | head -1)
          bash scripts/smoke-macos-app.sh "$APP" x86_64
      - name: Upload Intel bundle (3 days)
        uses: actions/upload-artifact@v4
        with:
          name: applyqueue-macos-x64
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 3
          if-no-files-found: error

  required:
    # Single required status check for branch protection on main.
    needs: [test, intel-mac]
    runs-on: ubuntu-latest
    if: always()
    name: Required checks
    steps:
      - name: All required jobs passed
        run: |
          echo "test=${{ needs.test.result }} intel-mac=${{ needs.intel-mac.result }}"
          if [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.intel-mac.result }}" = "success" ]; then
            echo "✅ All required jobs passed (Linux, Windows, Intel macOS)"
          else
            echo "❌ A required job failed or was skipped"
            exit 1
          fi
