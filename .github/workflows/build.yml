name: Build installers

# Unsigned installers for every desktop platform, built on STANDARD GitHub-hosted runners (free
# for this public repo; no larger/paid runner labels), plus the original self-hosted Linux build.
#
#   push to main (code paths)  -> all four hosted builds, installers uploaded as run artifacts
#   push of a v* tag           -> same, then a DRAFT release is created for the tag if none exists
#   workflow_dispatch          -> same; optional self-hosted Linux .deb; `probe` reports failing
#                                 steps without failing the run (for iterating on a branch)
#   pull_request / forks       -> never
#
# Nothing is code-signed or notarized (no certificates are configured): macOS Gatekeeper and
# Windows SmartScreen warn on first launch. README "Download" explains how to open them.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:
    inputs:
      self_hosted_linux:
        description: 'Also build the .deb on the self-hosted box runner'
        type: boolean
        default: false
      probe:
        description: 'Iteration mode: failing build/smoke steps are reported but do not fail the run'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  UV_PYTHON_PREFERENCE: only-managed
  CI: 'true'

jobs:
  hosted:
    if: github.event_name != 'pull_request' && github.repository == 'JonathanLiu1401/ApplyQueue'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 was retired by GitHub in Dec 2025; macos-15-intel is the standard Intel label.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macOS-Intel-x64
            arch: x86_64
            bundles: app,dmg
          - os: macos-14
            target: aarch64-apple-darwin
            label: macOS-AppleSilicon-arm64
            arch: arm64
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            bundles: nsis,msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev xdg-utils file libfuse2 xvfb
      - run: npm ci --no-audit --no-fund
      - name: Python dependencies (native ${{ matrix.target }})
        run: uv sync --frozen --python 3.13
      - name: Build backend sidecar (PyInstaller)
        if: runner.os != 'Windows'
        run: bash scripts/build-backend.sh ${{ matrix.target }}
      - name: Build backend sidecar (PyInstaller, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-backend.ps1
      - name: Sidecar self-test (frozen binary, bundled tz database)
        run: |
          BIN=$(ls src-tauri/binaries/applyqueue-backend-${{ matrix.target }}* | head -1)
          "$BIN" --self-test | tee "$RUNNER_TEMP/st.json"
          grep -q '"tzdb": true' "$RUNNER_TEMP/st.json"
          grep -q '"pdf": "ok"' "$RUNNER_TEMP/st.json"
      - name: Bundle app (${{ matrix.bundles }}, unsigned)
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect installers
        run: |
          B=src-tauri/target/${{ matrix.target }}/release/bundle
          mkdir -p "$RUNNER_TEMP/out"
          find "$B" -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} "$RUNNER_TEMP/out/" \;
          ls -la "$RUNNER_TEMP/out"
          ( cd "$RUNNER_TEMP/out" && files=(*) && shasum -a 256 "${files[@]}" > "SHA256SUMS-${{ matrix.label }}.txt" && cat SHA256SUMS-*.txt )
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ApplyQueue-${{ matrix.label }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30

      # Real-app smoke on the shipped artifact: launch it and wait for its bundled backend.
      - name: Smoke - open the .dmg, launch the app, GET /health (${{ matrix.arch }})
        if: runner.os == 'macOS'
        continue-on-error: ${{ inputs.probe == true }}
        run: |
          DMG=$(ls "$OUT"/*.dmg | head -1)
          MNT="$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          trap 'hdiutil detach "$MNT" -force || true' EXIT
          bash scripts/smoke-macos-app.sh "$(ls -d "$MNT"/*.app | head -1)" ${{ matrix.arch }}
      - name: Smoke - silent NSIS install, launch, GET /health, uninstall
        if: runner.os == 'Windows'
        continue-on-error: ${{ inputs.probe == true }}
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:OUT" -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no NSIS *-setup.exe in $env:OUT" }
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'ApplyQueue'
          Get-ChildItem $dir -Recurse -Filter *.exe | ForEach-Object { $_.FullName }
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notlike 'uninstall*' -and $_.Name -notlike 'applyqueue-backend*' } | Select-Object -First 1
          if (-not $exe) { throw "no installed app exe under $dir" }
          & ./scripts/smoke-windows-app.ps1 -Exe $exe.FullName
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "smoke failed ($LASTEXITCODE)" }
          Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
      - name: Smoke - AppImage and installed .deb, launch, GET /health
        if: runner.os == 'Linux'
        continue-on-error: ${{ inputs.probe == true }}
        run: |
          APPIMAGE=$(ls "$OUT"/*.AppImage | head -1)
          chmod +x "$APPIMAGE"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a bash scripts/smoke-app-health.sh "$APPIMAGE"
          sudo apt-get install -y "$(ls "$OUT"/*.deb | head -1)"
          BIN=$(dpkg -L "$(dpkg-deb -f "$(ls "$OUT"/*.deb | head -1)" Package)" | grep '^/usr/bin/' | grep -v applyqueue-backend | head -1)
          echo "installed binary: $BIN"
          xvfb-run -a bash scripts/smoke-app-health.sh "$BIN"

  self-hosted-linux:
    # The original self-hosted build (box runner): .deb only, on dispatch when ticked.
    name: Build (Linux-x64, self-hosted)
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.self_hosted_linux &&
      github.repository == 'JonathanLiu1401/ApplyQueue'
    runs-on: [self-hosted, linux, x64, applyqueue]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      # webkit2gtk etc. are preinstalled on the runner host: jobs never sudo.
      - run: npm ci --no-audit --no-fund
      - run: uv sync --frozen --python 3.13
      - run: bash scripts/build-backend.sh x86_64-unknown-linux-gnu
      - run: npx tauri build --target x86_64-unknown-linux-gnu --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: ApplyQueue-Linux-x64-self-hosted
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
      - name: Disk hygiene
        if: always()
        run: |
          rm -rf src-tauri/target src-tauri/binaries/applyqueue-backend-* dist build node_modules .venv
          uv cache prune --ci || true

  draft-release:
    # Tag builds only: create a DRAFT release with every installer, unless a release for the tag
    # already exists (e.g. it was drafted by hand or already published), which is left untouched.
    name: Draft release (tags only)
    needs: hosted
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'JonathanLiu1401/ApplyQueue'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-installers
          pattern: ApplyQueue-*
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -la dist-installers
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "A release for $TAG already exists; not touching it."
            exit 0
          fi
          cat dist-installers/SHA256SUMS-*.txt > dist-installers/SHA256SUMS.txt
          rm dist-installers/SHA256SUMS-*.txt
          gh release create "$TAG" -R "$REPO" --draft --verify-tag --title "ApplyQueue $TAG" \
            --notes "Unsigned builds. See the README Download section for which file to pick and how to open it." \
            dist-installers/*
