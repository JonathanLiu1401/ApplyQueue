name: CI

# Linux checks run on the self-hosted box runner; Windows and macOS (Intel + Apple silicon) run on
# STANDARD GitHub-hosted runners, which are free for this public repo (never larger/paid labels).
# Setup and history: docs/applyqueue/CI_RUNNERS.md.
#
#   push to main (code paths)   -> Linux checks + hosted Windows, Intel Mac, Apple silicon tests
#   push of a v* tag            -> same
#   push to other branches      -> nothing (use workflow_dispatch on the branch: --ref <branch>)
#   docs-only pushes            -> nothing (paths-ignore); the full-tree privacy scan runs on
#                                  the next code push and on every dispatch
#   pull_request / fork PRs     -> never (no pull_request triggers; jobs also refuse them)
#   workflow_dispatch           -> choose jobs; `linux_app` adds the real Linux app over WebDriver
#                                  + .deb; `probe` reports failing test steps without failing the
#                                  run (iterate on a branch without red runs / failure emails):
#     gh workflow run ci.yml -R JonathanLiu1401/ApplyQueue --ref <branch> -f probe=true
#
# Real-app smoke tests of the shipped installers (launch + /health on every OS) are in build.yml.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
  workflow_dispatch:
    inputs:
      linux:
        description: 'Linux checks (self-hosted box runner)'
        type: boolean
        default: true
      linux_app:
        description: 'Linux: compile the real Tauri app, drive it over WebDriver, bundle .deb'
        type: boolean
        default: false
      windows:
        description: 'Windows (GitHub-hosted windows-latest)'
        type: boolean
        default: true
      intel_mac:
        description: 'Intel Mac (GitHub-hosted macos-15-intel)'
        type: boolean
        default: true
      apple_silicon:
        description: 'Apple silicon (GitHub-hosted macos-14)'
        type: boolean
        default: true
      probe:
        description: 'Iteration mode: failing test steps are reported but do not fail the run'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON_PREFERENCE: only-managed
  CI: 'true'

jobs:
  linux:
    name: Linux checks (privacy, licenses, unit, e2e, break-it)
    if: >-
      github.event_name != 'pull_request' && github.repository == 'JonathanLiu1401/ApplyQueue' &&
      (github.event_name != 'workflow_dispatch' || inputs.linux)
    runs-on: [self-hosted, linux, x64, applyqueue]
    timeout-minutes: 60
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: gitleaks (all commits + working tree)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --exit-code 1 --max-target-megabytes 5 .
      - name: Personal-data scan (generic rules + hashed denylist)
        # Hash denylist comes from a repo secret; raw values are never stored in this repo.
        env:
          PRIVACY_DENYLIST_SHA256: ${{ secrets.PRIVACY_DENYLIST_SHA256 }}
        run: node scripts/privacy-scan.mjs
      - name: npm licenses (from package-lock.json)
        run: node scripts/license-check.mjs
      - run: npm ci --no-audit --no-fund
      - run: uv sync --frozen --python 3.13
      - name: Python licenses (sidecar deps)
        run: uv run python scripts/license-check-python.py
      - name: Intel Mac wheel coverage (every locked dep has a macOS x86_64 wheel)
        run: python3 scripts/check-macos-x64-wheels.py uv.lock
      - name: TypeScript type check
        run: npx tsc --noEmit --skipLibCheck
      - name: ESLint
        run: npx eslint . --max-warnings 0
        continue-on-error: true
      - name: Frontend build (Vite)
        run: npm run build
      - name: Frontend unit tests (Vitest + coverage)
        run: npm run test:coverage
      - name: Playwright Chromium (system libraries are preinstalled on the runner host)
        run: uv run python -m playwright install chromium
      - name: Backend + agent e2e + break-it tests (pytest + coverage)
        run: uv run pytest tests/ --ignore=tests/ui_e2e --ignore=tests/webdriver --cov --cov-report=term-missing -p no:cacheprovider
      - name: Build backend sidecar
        run: bash scripts/build-backend.sh x86_64-unknown-linux-gnu
      - name: Sidecar self-test (frozen binary, bundled tz database)
        run: |
          src-tauri/binaries/applyqueue-backend-x86_64-unknown-linux-gnu --self-test | tee "$RUNNER_TEMP/st.json"
          grep -q '"tzdb": true' "$RUNNER_TEMP/st.json"
      - name: UI e2e + adversarial (production frontend + packaged sidecar)
        run: |
          APPLYQUEUE_SIDECAR="$PWD/src-tauri/binaries/applyqueue-backend-x86_64-unknown-linux-gnu" \
            uv run pytest tests/ui_e2e -q -rs -p no:cacheprovider
      - name: Disk hygiene (build output, deps, caches)
        if: always()
        run: |
          rm -rf src-tauri/target src-tauri/binaries/applyqueue-backend-* dist build node_modules .venv coverage htmlcov .coverage
          uv cache prune --ci || true
          npm cache clean --force >/dev/null 2>&1 || true
          df -h . | tail -1

  linux-app:
    # The real app: Rust/Tauri compile, WebDriver over WebKitWebDriver, .deb bundle. Dispatch only.
    name: Linux app (Tauri compile, WebDriver, .deb)
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.linux_app &&
      github.repository == 'JonathanLiu1401/ApplyQueue'
    runs-on: [self-hosted, linux, x64, applyqueue]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --no-audit --no-fund
      - run: uv sync --frozen --python 3.13
      - name: Build backend sidecar
        run: bash scripts/build-backend.sh x86_64-unknown-linux-gnu
      - name: Compile + bundle Tauri app (.deb, unsigned)
        run: npx tauri build --target x86_64-unknown-linux-gnu --bundles deb
      - name: Rust unit tests (open_file path checks)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --target x86_64-unknown-linux-gnu
      - name: Real Tauri app over WebDriver (tauri-driver + WebKitWebDriver, preinstalled)
        run: |
          command -v tauri-driver >/dev/null || cargo install tauri-driver --locked
          APPLYQUEUE_TAURI_APP="$PWD/src-tauri/target/x86_64-unknown-linux-gnu/release/app" \
            xvfb-run -a uv run pytest tests/webdriver -q -x -p no:cacheprovider
      - name: Disk hygiene
        if: always()
        run: |
          rm -rf src-tauri/target src-tauri/binaries/applyqueue-backend-* dist build node_modules .venv
          uv cache prune --ci || true
          df -h . | tail -1

  windows:
    name: Windows (unit, e2e, sidecar, real app over WebDriver)
    if: >-
      github.repository == 'JonathanLiu1401/ApplyQueue' && github.event_name != 'pull_request' &&
      (github.event_name == 'push' || inputs.windows)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --no-audit --no-fund
      - name: Python dependencies (native)
        run: |
          uv sync --frozen --python 3.13
          uv run python -c "import platform, sys; print(platform.system(), platform.machine(), sys.version)"
      - name: TypeScript type check
        continue-on-error: ${{ inputs.probe == true }}
        run: npx tsc --noEmit --skipLibCheck
      - name: Frontend unit tests (Vitest)
        continue-on-error: ${{ inputs.probe == true }}
        run: npm run test:coverage
      - name: Frontend build (Vite)
        run: npm run build
      - name: Playwright Chromium
        run: uv run python -m playwright install chromium
      - name: Backend + agent e2e + break-it tests (pytest)
        continue-on-error: ${{ inputs.probe == true }}
        run: uv run pytest tests/ --ignore=tests/ui_e2e --ignore=tests/webdriver -q -p no:cacheprovider
      - name: Build backend sidecar (PyInstaller)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-backend.ps1
      - name: Sidecar self-test (frozen binary)
        continue-on-error: ${{ inputs.probe == true }}
        run: |
          src-tauri/binaries/applyqueue-backend-x86_64-pc-windows-msvc.exe --self-test | tee "$RUNNER_TEMP/st.json"
          grep -q '"tzdb": true' "$RUNNER_TEMP/st.json"
      - name: UI e2e + adversarial (production frontend + packaged sidecar)
        continue-on-error: ${{ inputs.probe == true }}
        run: |
          APPLYQUEUE_SIDECAR="$(cygpath -m "$PWD")/src-tauri/binaries/applyqueue-backend-x86_64-pc-windows-msvc.exe" \
            uv run pytest tests/ui_e2e -q -rs -p no:cacheprovider | tee "$RUNNER_TEMP/ui.log"
          if grep -q SKIPPED "$RUNNER_TEMP/ui.log"; then echo "::error::UI e2e tests were skipped"; exit 1; fi
      - name: Rust unit tests (open_file path checks)
        continue-on-error: ${{ inputs.probe == true }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --target x86_64-pc-windows-msvc
      - name: Compile Tauri app (no bundle, unsigned)
        run: npx tauri build --no-bundle --target x86_64-pc-windows-msvc
      - name: Real Tauri app over WebDriver (tauri-driver + msedgedriver)
        continue-on-error: ${{ inputs.probe == true }}
        run: |
          cargo install tauri-driver --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool
          (cd "$RUNNER_TEMP" && msedgedriver-tool)
          export APPLYQUEUE_NATIVE_DRIVER="$(cygpath -m "$RUNNER_TEMP")/msedgedriver.exe"
          export APPLYQUEUE_TAURI_APP="$(cygpath -m "$PWD")/src-tauri/target/x86_64-pc-windows-msvc/release/app.exe"
          test -f "$APPLYQUEUE_TAURI_APP" && test -f "$APPLYQUEUE_NATIVE_DRIVER"
          uv run pytest tests/webdriver -q -x -rs -p no:cacheprovider | tee "$RUNNER_TEMP/wd.log"
          if grep -q SKIPPED "$RUNNER_TEMP/wd.log"; then echo "::error::WebDriver tests were skipped"; exit 1; fi

  intel-mac:
    # Real-app smoke (open the .dmg, launch the app, GET /health) is in build.yml: Apple's
    # WKWebView has no WebDriver, so the UI is covered by tests/ui_e2e against the packaged sidecar.
    name: Intel Mac (unit, e2e, sidecar, UI e2e)
    if: >-
      github.repository == 'JonathanLiu1401/ApplyQueue' && github.event_name != 'pull_request' &&
      (github.event_name == 'push' || inputs.intel_mac)
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --no-audit --no-fund
      - name: Python dependencies (native)
        run: |
          uv sync --frozen --python 3.13
          uv run python -c "import platform, sys; print(platform.system(), platform.machine(), sys.version)"
      - name: Python is native x86_64
        run: test "$(uv run python -c 'import platform; print(platform.machine())')" = "x86_64"
      - name: TypeScript type check
        continue-on-error: ${{ inputs.probe == true }}
        run: npx tsc --noEmit --skipLibCheck
      - name: Frontend unit tests (Vitest)
        continue-on-error: ${{ inputs.probe == true }}
        run: npm run test:coverage
      - name: Frontend build (Vite)
        run: npm run build
      - name: Playwright Chromium
        run: uv run python -m playwright install chromium
      - name: Backend + agent e2e + break-it tests (pytest)
        continue-on-error: ${{ inputs.probe == true }}
        run: uv run pytest tests/ --ignore=tests/ui_e2e --ignore=tests/webdriver -q -p no:cacheprovider
      - name: Build backend sidecar (x86_64)
        run: bash scripts/build-backend.sh x86_64-apple-darwin
      - name: Sidecar self-test (frozen binary)
        continue-on-error: ${{ inputs.probe == true }}
        run: |
          src-tauri/binaries/applyqueue-backend-x86_64-apple-darwin --self-test | tee "$RUNNER_TEMP/st.json"
          grep -q '"machine": "x86_64"' "$RUNNER_TEMP/st.json"
          grep -q '"tzdb": true' "$RUNNER_TEMP/st.json"
      - name: UI e2e + adversarial (production frontend + packaged sidecar)
        continue-on-error: ${{ inputs.probe == true }}
        run: |
          APPLYQUEUE_SIDECAR="$PWD/src-tauri/binaries/applyqueue-backend-x86_64-apple-darwin" \
            uv run pytest tests/ui_e2e -q -rs -p no:cacheprovider | tee "$RUNNER_TEMP/ui.log"
          if grep -q SKIPPED "$RUNNER_TEMP/ui.log"; then echo "::error::UI e2e tests were skipped"; exit 1; fi
      - name: Rust unit tests (open_file path checks)
        continue-on-error: ${{ inputs.probe == true }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --target x86_64-apple-darwin

  apple-silicon:
    # Real-app smoke (open the .dmg, launch the app, GET /health) is in build.yml: Apple's
    # WKWebView has no WebDriver, so the UI is covered by tests/ui_e2e against the packaged sidecar.
    name: Apple silicon (unit, e2e, sidecar, UI e2e)
    if: >-
      github.repository == 'JonathanLiu1401/ApplyQueue' && github.event_name != 'pull_request' &&
      (github.event_name == 'push' || inputs.apple_silicon)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --no-audit --no-fund
      - name: Python dependencies (native)
        run: |
          uv sync --frozen --python 3.13
          uv run python -c "import platform, sys; print(platform.system(), platform.machine(), sys.version)"
      - name: Python is native arm64
        run: test "$(uv run python -c 'import platform; print(platform.machine())')" = "arm64"
      - name: TypeScript type check
        continue-on-error: ${{ inputs.probe == true }}
        run: npx tsc --noEmit --skipLibCheck
      - name: Frontend unit tests (Vitest)
        continue-on-error: ${{ inputs.probe == true }}
        run: npm run test:coverage
      - name: Frontend build (Vite)
        run: npm run build
      - name: Playwright Chromium
        run: uv run python -m playwright install chromium
      - name: Backend + agent e2e + break-it tests (pytest)
        continue-on-error: ${{ inputs.probe == true }}
        run: uv run pytest tests/ --ignore=tests/ui_e2e --ignore=tests/webdriver -q -p no:cacheprovider
      - name: Build backend sidecar (arm64)
        run: bash scripts/build-backend.sh aarch64-apple-darwin
      - name: Sidecar self-test (frozen binary)
        continue-on-error: ${{ inputs.probe == true }}
        run: |
          src-tauri/binaries/applyqueue-backend-aarch64-apple-darwin --self-test | tee "$RUNNER_TEMP/st.json"
          grep -q '"machine": "arm64"' "$RUNNER_TEMP/st.json"
          grep -q '"tzdb": true' "$RUNNER_TEMP/st.json"
      - name: UI e2e + adversarial (production frontend + packaged sidecar)
        continue-on-error: ${{ inputs.probe == true }}
        run: |
          APPLYQUEUE_SIDECAR="$PWD/src-tauri/binaries/applyqueue-backend-aarch64-apple-darwin" \
            uv run pytest tests/ui_e2e -q -rs -p no:cacheprovider | tee "$RUNNER_TEMP/ui.log"
          if grep -q SKIPPED "$RUNNER_TEMP/ui.log"; then echo "::error::UI e2e tests were skipped"; exit 1; fi
      - name: Rust unit tests (open_file path checks)
        continue-on-error: ${{ inputs.probe == true }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --target aarch64-apple-darwin

  required:
    # Single status check ("Required checks"): every job that ran must pass; jobs that were not
    # selected (skipped) are fine. Linux checks must pass unless a dispatch turned them off.
    name: Required checks
    needs: [linux, linux-app, windows, intel-mac, apple-silicon]
    if: always() && github.event_name != 'pull_request' && github.repository == 'JonathanLiu1401/ApplyQueue'
    runs-on: [self-hosted, linux, x64, applyqueue]
    steps:
      - name: All selected jobs passed
        env:
          LINUX: ${{ needs.linux.result }}
          LINUX_WANTED: ${{ github.event_name != 'workflow_dispatch' || inputs.linux }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "linux=$LINUX (wanted: $LINUX_WANTED) all=$RESULTS"
          if [ "$LINUX_WANTED" = true ] && [ "$LINUX" != success ]; then echo "::error::Linux checks: $LINUX"; exit 1; fi
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a selected job ended as $r"; exit 1 ;; esac
          done
