name: Build Check

# Compiles the full desktop app (PyInstaller sidecar + Tauri) without publishing anything.
# Cost control for a private repo (Linux 1x, Windows 2x, macOS 10x minutes):
# - runs only when build-relevant paths change;
# - push/PR builds Linux x64 + Windows x64; macOS ARM64 runs only on manual dispatch.
# Release builds stay in build.yml (tag/dispatch only).
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'backend/**'
      - 'scripts/build-backend.*'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/build-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'backend/**'
      - 'scripts/build-backend.*'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/build-check.yml'
  workflow_dispatch:
    inputs:
      run_macos:
        description: 'Also build macOS ARM64 (~10x minutes)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.m.outputs.include }}
    steps:
      - id: m
        run: |
          BASE='{"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","label":"Linux-x64"},{"platform":"windows-latest","target":"x86_64-pc-windows-msvc","label":"Windows-x64"}'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_macos }}" = "true" ]; then
            BASE="$BASE"',{"platform":"macos-latest","target":"aarch64-apple-darwin","label":"macOS-ARM64"}'
          fi
          echo "include=[$BASE]" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: npm ci
      - name: Python dependencies
        # uv-managed CPython ships libpython as a shared lib, which PyInstaller needs.
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: uv sync --frozen --python 3.13
      - name: Build backend sidecar
        if: runner.os != 'Windows'
        run: bash scripts/build-backend.sh ${{ matrix.target }}
      - name: Build backend sidecar (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File scripts/build-backend.ps1
      - name: Compile Tauri app (no bundle, unsigned)
        run: npx tauri build --no-bundle --target ${{ matrix.target }}
