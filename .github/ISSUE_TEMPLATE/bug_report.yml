name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste personal data, passwords, cookies, tokens, or resumes.** Redact names,
        emails, and phone numbers from logs and screenshots. Security issues: see SECURITY.md instead.
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Steps to reproduce and what you expected. }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: ApplyQueue version, placeholder: v0.0.1 }
  - type: dropdown
    id: os
    attributes: { label: OS, options: [macOS, Windows, Linux] }
  - type: dropdown
    id: backend
    attributes:
      label: AI backend
      options: [Grok Bot, Local (Ollama / LM Studio / llama.cpp / HF), ChatGPT, Claude, Gemini, Cursor, Other]
  - type: textarea
    id: logs
    attributes: { label: Redacted logs, render: text }
