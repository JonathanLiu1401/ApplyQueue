name: CI (privacy + licenses)

# Cheap, Linux-only gate that runs on every push and PR, whatever changed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Secret + personal-data scan (full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (all commits + working tree)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
          ./gitleaks dir --redact --no-banner --exit-code 1 --max-target-megabytes 5 .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Personal-data scan (generic rules + hashed denylist)
        # Hash denylist comes from a repo secret; raw values are never stored in this repo.
        env:
          PRIVACY_DENYLIST_SHA256: ${{ secrets.PRIVACY_DENYLIST_SHA256 }}
        run: node scripts/privacy-scan.mjs

  licenses:
    name: Dependency licenses (npm + Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm licenses (from package-lock.json)
        run: node scripts/license-check.mjs
      - uses: astral-sh/setup-uv@v7
      - name: Python licenses (sidecar deps)
        run: |
          uv sync --frozen --python 3.13
          uv run python scripts/license-check-python.py
