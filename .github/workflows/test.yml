name: Integration Tests

# Minutes are billed per OS on a private repo (Linux 1x, Windows 2x, macOS 10x), so:
#
#   every push / PR (code paths)  -> "Linux checks" only (cheap, cached)
#   push to main (code paths)     -> + Windows + Intel Mac (+ Build Check workflow on its own paths)
#   nightly (only if main moved)  -> full 4-platform suite: Linux, Windows, Intel Mac, Apple silicon
#                                    + Build Check (real app over WebDriver)
#   workflow_dispatch             -> full 4-platform suite + Build Check by default (one command):
#       gh workflow run test.yml -R JonathanLiu1401/ApplyQueue --ref main
#
# Intel Macs (x86_64) are a hard requirement: "Required checks" demands the native Intel job
# on every run that is meant for main (push to main, nightly, dispatch) and on releases
# (build.yml builds macos-15-intel natively). Branch/PR runs only need Linux checks.
on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'backend/**'
      - 'cli/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/test.yml'
      - '.github/workflows/build-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'backend/**'
      - 'cli/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/test.yml'
      - '.github/workflows/build-check.yml'
  schedule:
    - cron: '23 10 * * *'   # 03:23 PDT / 02:23 PST
  workflow_dispatch:
    inputs:
      full:
        description: 'Full suite (Windows + Intel Mac + Build Check); false = Linux checks only'
        type: boolean
        default: true
      apple_silicon:
        description: 'Include Apple silicon (macOS arm64, ~10x minutes)'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  # Superseded branch/PR runs are cancelled; runs on main are never cancelled (each commit on
  # main keeps its own Required checks result), and push/dispatch/nightly never cancel each other.
  group: test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.p.outputs.full }}
      include: ${{ steps.p.outputs.include }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EV="${{ github.event_name }}"; REF="${{ github.ref }}"
          full=false; arm=false
          if [ "$EV" = "push" ] && [ "$REF" = "refs/heads/main" ]; then full=true; fi
          if [ "$EV" = "workflow_dispatch" ] && [ "${{ inputs.full }}" = "true" ]; then
            full=true; [ "${{ inputs.apple_silicon }}" = "true" ] && arm=true
          fi
          if [ "$EV" = "schedule" ]; then
            # Skip the nightly when main has not moved since the last successful nightly.
            last=$(gh api "repos/${{ github.repository }}/actions/workflows/test.yml/runs?event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' || true)
            if [ "$last" != "${{ github.sha }}" ]; then full=true; arm=true; else echo "main unchanged since last nightly; skipping"; fi
          fi
          inc='{"platform":"windows-latest","target":"x86_64-pc-windows-msvc","label":"Windows-x64"}'
          [ "$arm" = "true" ] && inc="$inc"',{"platform":"macos-latest","target":"aarch64-apple-darwin","label":"macOS-ARM64"}'
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "include=[$inc]" >> "$GITHUB_OUTPUT"
          echo "full=$full apple_silicon=$arm"

  linux:
    # Cheap checks on every run: static analysis, unit tests, agent e2e (mock ATS), packaged
    # sidecar + UI e2e and the break-it suite. Linux is the only OS on branch/PR runs.
    needs: plan
    if: needs.plan.outputs.full == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    name: Linux checks
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: npm ci
      - run: uv sync --frozen --python 3.13
      - name: Intel Mac wheel coverage (every locked dep has a macOS x86_64 wheel)
        run: python3 scripts/check-macos-x64-wheels.py uv.lock
      - name: TypeScript type check
        run: npx tsc --noEmit --skipLibCheck
      - name: ESLint
        run: npx eslint . --max-warnings 0
        continue-on-error: true
      - name: Frontend build (Vite)
        run: npm run build
      - name: Frontend unit tests (Vitest + coverage)
        run: npm run test:coverage
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Playwright Chromium
        run: uv run python -m playwright install --with-deps chromium
      - name: Backend + agent e2e + break-it tests (pytest + coverage)
        run: uv run pytest tests/ --ignore=tests/ui_e2e --cov --cov-report=term-missing --cov-report=xml -p no:cacheprovider
      - name: Build backend sidecar
        run: bash scripts/build-backend.sh x86_64-unknown-linux-gnu
      - name: UI e2e + adversarial (production frontend + packaged sidecar)
        run: |
          APPLYQUEUE_SIDECAR="$PWD/src-tauri/binaries/applyqueue-backend-x86_64-unknown-linux-gnu" \
            uv run pytest tests/ui_e2e -q -rs -p no:cacheprovider

  test:
    # Windows (+ Apple silicon on nightly/dispatch). Only on runs meant for main.
    needs: plan
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.platform }}
    name: Test (${{ matrix.label }})
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen --python 3.13
      - name: TypeScript type check
        run: npx tsc --noEmit --skipLibCheck
      - name: Frontend unit tests (Vitest)
        run: npm run test:coverage
      - name: Install Playwright Chromium
        run: uv run python -m playwright install chromium
      - name: Backend + agent e2e + break-it tests (pytest)
        run: uv run pytest tests/ --ignore=tests/ui_e2e -q -p no:cacheprovider
      - name: Build backend sidecar (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/build-backend.sh ${{ matrix.target }}
      - name: Build backend sidecar (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File scripts/build-backend.ps1
      - name: Sidecar self-test (frozen binary)
        shell: bash
        run: |
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          "src-tauri/binaries/applyqueue-backend-${{ matrix.target }}$EXT" --self-test | tee st.json
          grep -q '"tzdb": true' st.json
      - name: UI e2e (production frontend + packaged sidecar)
        shell: bash
        run: |
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          APPLYQUEUE_SIDECAR="$PWD/src-tauri/binaries/applyqueue-backend-${{ matrix.target }}$EXT" \
            uv run pytest tests/ui_e2e -q -rs -p no:cacheprovider

  intel-mac:
    # Intel Macs (x86_64) are a hard requirement: test natively (never Rosetta), build the
    # x86_64 PyInstaller sidecar, bundle the .app/.dmg, launch it and check /health.
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: macos-15-intel
    name: Intel Mac (test, bundle, launch /health)
    timeout-minutes: 75
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Python dependencies (native x86_64)
        run: |
          uv sync --frozen --python 3.13
          ARCH=$(uv run python -c "import platform; print(platform.machine())")
          echo "Python arch: $ARCH"
          test "$ARCH" = "x86_64"
      - run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: pw-intel-mac-${{ hashFiles('uv.lock') }}
      - name: Install Playwright Chromium (mock ATS + agent e2e)
        run: uv run python -m playwright install chromium
      - name: Backend unit tests (pytest, x86_64)
        run: uv run pytest tests/ --ignore=tests/ui_e2e -q -p no:cacheprovider
      - name: Build backend sidecar (x86_64)
        run: bash scripts/build-backend.sh x86_64-apple-darwin
      - name: Sidecar self-test (frozen binary)
        run: |
          src-tauri/binaries/applyqueue-backend-x86_64-apple-darwin --self-test | tee st.json
          grep -q '"machine": "x86_64"' st.json
          grep -q '"tzdb": true' st.json
      - name: Bundle Tauri app (x86_64, unsigned)
        run: npx tauri build --target x86_64-apple-darwin --bundles app,dmg
      - name: UI e2e (production frontend + packaged x86_64 sidecar)
        run: |
          APPLYQUEUE_SIDECAR="$PWD/src-tauri/binaries/applyqueue-backend-x86_64-apple-darwin" \
            uv run pytest tests/ui_e2e -q -rs -p no:cacheprovider
      - name: Launch packaged app and check /health
        run: |
          APP=$(ls -d src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app | head -1)
          bash scripts/smoke-macos-app.sh "$APP" x86_64
      - name: Upload Intel bundle (3 days)
        uses: actions/upload-artifact@v4
        with:
          name: applyqueue-macos-x64
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 3
          if-no-files-found: error

  build-check:
    # Real Tauri app over WebDriver (Linux + Windows) and the macOS arm64 build, on the full
    # runs that don't come from a push (pushes trigger build-check.yml by its own path filter).
    needs: plan
    if: needs.plan.outputs.full == 'true' && github.event_name != 'push'
    uses: ./.github/workflows/build-check.yml
    with:
      run_macos: ${{ github.event_name == 'schedule' || inputs.apple_silicon == true }}

  required:
    # Single required status check for branch protection on main.
    needs: [plan, linux, test, intel-mac, build-check]
    runs-on: ubuntu-latest
    if: always()
    name: Required checks
    steps:
      - name: All required jobs passed
        run: |
          full="${{ needs.plan.outputs.full }}"
          echo "full=$full linux=${{ needs.linux.result }} test=${{ needs.test.result }} intel-mac=${{ needs.intel-mac.result }} build-check=${{ needs.build-check.result }}"
          ok() { [ "$1" = "success" ]; }
          ok "${{ needs.plan.result }}" || { echo "plan failed"; exit 1; }
          if [ "$full" = "true" ]; then
            ok "${{ needs.linux.result }}" && ok "${{ needs.test.result }}" && ok "${{ needs.intel-mac.result }}" \
              || { echo "❌ full run: Linux, Windows (and Apple silicon if selected) and Intel Mac must all pass"; exit 1; }
            case "${{ needs.build-check.result }}" in success|skipped) ;; *) echo "❌ Build Check failed"; exit 1;; esac
            echo "✅ full run passed (Intel Mac included)"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "✅ nightly skipped: main unchanged"
          else
            ok "${{ needs.linux.result }}" || { echo "❌ Linux checks failed"; exit 1; }
            echo "✅ branch/PR run: Linux checks passed (Windows + Intel Mac run on push to main)"
          fi
