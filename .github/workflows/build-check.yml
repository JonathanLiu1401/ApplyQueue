name: Build Check

# Compiles the full desktop app (PyInstaller sidecar + Tauri) without publishing anything.
# Cost control for a private repo (Linux 1x, Windows 2x, macOS 10x minutes):
# - runs only when build-relevant paths change;
# - PRs build Linux only; push to main builds Linux + Windows; macOS ARM64 only on manual
#   dispatch or when called from test.yml (nightly / full dispatch).
# Release builds stay in build.yml (tag/dispatch only).
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'backend/**'
      - 'scripts/build-backend.*'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/webdriver/**'
      - '.github/workflows/build-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'backend/**'
      - 'scripts/build-backend.*'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/webdriver/**'
      - '.github/workflows/build-check.yml'
  workflow_dispatch:
    inputs:
      run_macos:
        description: 'Also build macOS ARM64 (~10x minutes)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_macos:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.m.outputs.include }}
    steps:
      - id: m
        run: |
          BASE='{"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","label":"Linux-x64"}'
          WIN=',{"platform":"windows-latest","target":"x86_64-pc-windows-msvc","label":"Windows-x64"}'
          MAC=',{"platform":"macos-latest","target":"aarch64-apple-darwin","label":"macOS-ARM64"}'
          [ "${{ github.event_name }}" != "pull_request" ] && BASE="$BASE$WIN"
          [ "${{ inputs.run_macos }}" = "true" ] && BASE="$BASE$MAC"
          echo "include=[$BASE]" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: npm ci
      - name: Python dependencies
        # uv-managed CPython ships libpython as a shared lib, which PyInstaller needs.
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: uv sync --frozen --python 3.13
      - name: Build backend sidecar
        if: runner.os != 'Windows'
        run: bash scripts/build-backend.sh ${{ matrix.target }}
      - name: Build backend sidecar (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File scripts/build-backend.ps1
      - name: Sidecar self-test (frozen binary, bundled tz database)
        shell: bash
        run: |
          for b in src-tauri/binaries/applyqueue-backend-${{ matrix.target }}*; do
            "$b" --self-test | tee self-test.json
            grep -q '"tzdb": true' self-test.json
          done
      - name: Compile Tauri app (no bundle, unsigned)
        run: npx tauri build --no-bundle --target ${{ matrix.target }}
      - name: Real Tauri app over WebDriver (Linux)
        # tauri-driver + WebKitWebDriver drive the real webview; the Rust shell spawns the bundled sidecar.
        if: runner.os == 'Linux'
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb
          cargo install tauri-driver --locked
          APPLYQUEUE_TAURI_APP="$PWD/src-tauri/target/${{ matrix.target }}/release/app" \
            xvfb-run -a uv run pytest tests/webdriver -q -x -p no:cacheprovider
      - name: Real Tauri app over WebDriver (Windows, experimental)
        # tauri-driver + msedgedriver matching the installed WebView2 runtime (msedgedriver-tool).
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          cargo install tauri-driver --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool
          (cd "$RUNNER_TEMP" && msedgedriver-tool)
          export APPLYQUEUE_NATIVE_DRIVER="$RUNNER_TEMP/msedgedriver.exe"
          export APPLYQUEUE_TAURI_APP="$PWD/src-tauri/target/${{ matrix.target }}/release/app.exe"
          ls -la "$APPLYQUEUE_NATIVE_DRIVER" "$APPLYQUEUE_TAURI_APP"
          uv run pytest tests/webdriver -q -x -rA -s -p no:cacheprovider
